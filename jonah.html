<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Jonah's Journey</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Press+Start+2P&display=swap">
<style>
/* One fixed look on purpose: a dark pixel-game frame with warm parchment text boxes. */
:root {
  --night: #0e0b1a;
  --panel: #1d1832;
  --panel-2: #2a2347;
  --ink: #f6ecd6;
  --ink-soft: #c9bda2;
  --parch: #f2e3bd;
  --parch-ink: #3b2616;
  --gold: #f2c14e;
  --gold-deep: #c8902a;
  --sea: #3d8ec2;
  --leaf: #6fbf4a;
  --red: #e0533a;
  --ol: #1c1426;
  --pixel: "Press Start 2P", ui-monospace, monospace;
  --body: "Andika", "Verdana", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--night); color: var(--ink); font-family: var(--body); }
body { display: grid; place-items: center; min-height: 100dvh; overflow: hidden; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
[hidden] { display: none !important; }
#stage { position: relative; width: min(100vw, calc(100dvh * 5 / 3)); aspect-ratio: 5 / 3; container-type: inline-size; overflow: hidden; background: #000; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
button { font-family: var(--body); cursor: pointer; }

/* ---------- HUD ---------- */
#hud { position: absolute; inset: 0; pointer-events: none; font-size: clamp(11px, 1.7cqw, 18px); }
#goals { position: absolute; left: 1.2cqw; top: 1.2cqw; background: rgba(14, 11, 26, .78); border: 2px solid rgba(242, 227, 189, .5); border-radius: 6px; padding: .4em .7em; max-width: 42cqw; line-height: 1.35; }
#goals .g { display: flex; gap: .4em; align-items: baseline; }
#goals .g.done { color: var(--leaf); }
#goals .g.done .lbl { text-decoration: line-through; opacity: .8; }
#goals .head { font-family: var(--pixel); font-size: .62em; color: var(--gold); margin-bottom: .3em; letter-spacing: .04em; }
#topc { position: absolute; left: 50%; top: 1.2cqw; transform: translateX(-50%); text-align: center; }
#lvname { font-family: var(--pixel); font-size: .62em; color: var(--parch); background: rgba(14, 11, 26, .7); padding: .4em .7em; border-radius: 6px; white-space: nowrap; }
#meter { margin-top: .4em; background: rgba(14, 11, 26, .8); border-radius: 6px; padding: .3em .6em; }
#meterLabel { font-size: .85em; font-weight: 700; display: block; }
#meter .bar { width: 26cqw; height: 1.4cqw; min-height: 8px; background: #3a2f55; border-radius: 4px; overflow: hidden; margin-top: .2em; }
#meterFill { display: block; height: 100%; width: 50%; background: var(--leaf); transition: width .2s; }
#topr { position: absolute; right: 1.2cqw; top: 1.2cqw; display: flex; gap: .5em; align-items: center; pointer-events: auto; }
#topr .chip { background: rgba(14, 11, 26, .78); border: 2px solid rgba(242, 227, 189, .4); border-radius: 6px; padding: .25em .55em; font-weight: 700; }
#topr button { background: rgba(14, 11, 26, .78); color: var(--ink); border: 2px solid rgba(242, 227, 189, .4); border-radius: 6px; font-size: 1em; padding: .2em .5em; }

/* ---------- Touch controls ---------- */
#touch { position: absolute; inset: auto 0 0 0; height: 0; pointer-events: none; }
#touch .pad { position: absolute; bottom: 1.6cqw; display: flex; gap: 1.2cqw; pointer-events: auto; }
#touch .pl { left: 1.6cqw; }
#touch .pr { right: 1.6cqw; }
#touch .pu { left: 50%; transform: translateX(-50%); flex-direction: column; }
#touch .pad.off { opacity: .35; }
#touch .tag { position: absolute; left: 0; bottom: 100%; margin-bottom: .8cqw; font-family: var(--pixel); font-size: clamp(8px, 1.3cqw, 12px); color: #fff; background: rgba(20, 16, 40, .6); padding: .35em .5em; border-radius: 4px; white-space: nowrap; }
#touch .pr .tag { left: auto; right: 0; }
#touch button { width: 8cqw; height: 8cqw; min-width: 42px; min-height: 42px; border-radius: 50%; border: 3px solid rgba(255, 255, 255, .55); background: rgba(20, 16, 40, .45); color: #fff; font-size: clamp(16px, 3.4cqw, 30px); touch-action: none; }
#touch button.on { background: rgba(242, 193, 78, .6); }
#touch button.hint { box-shadow: 0 0 0 4px var(--gold); }

/* ---------- Thought bubble while playing ---------- */
#bubble { position: absolute; left: 50%; top: 14cqw; transform: translateX(-50%); max-width: 62cqw; background: #fff; color: #2a2040; border-radius: 2.5cqw; padding: .55em .9em; font-size: clamp(12px, 2cqw, 20px); font-style: italic; box-shadow: 0 0 0 3px var(--ol); pointer-events: none; text-align: center; }
#bubble::before { content: "💭 Jonah thinks"; display: block; font-style: normal; font-weight: 700; font-size: .75em; color: #6a5a90; }

/* ---------- Talk boxes ---------- */
#layer { position: absolute; inset: 0; pointer-events: none; }
#layer > * { pointer-events: auto; }
.talk { position: absolute; left: 3cqw; right: 3cqw; bottom: 2.5cqw; display: flex; gap: 1.6cqw; align-items: flex-start; background: var(--panel); border: 3px solid var(--parch); box-shadow: 0 0 0 3px var(--ol), 0 6px 0 3px rgba(0,0,0,.35); border-radius: 8px; padding: 1.4cqw 1.8cqw; font-size: clamp(14px, 2.35cqw, 25px); line-height: 1.4; min-height: 15cqw; animation: pop .16s ease-out; cursor: pointer; }
.talk canvas { width: 10cqw; height: 10cqw; min-width: 48px; min-height: 48px; image-rendering: pixelated; background: var(--panel-2); border-radius: 6px; flex: none; }
.talk .who { font-family: var(--pixel); font-size: .55em; color: var(--gold); margin-bottom: .45em; letter-spacing: .04em; }
.talk .txt { flex: 1; }
.talk .ref { display: block; margin-top: .35em; font-size: .72em; color: var(--ink-soft); font-style: normal; }
.talk .ctl { display: flex; flex-direction: column; gap: .4em; align-items: flex-end; }
.talk .ctl button { background: transparent; color: var(--ink); border: 2px solid rgba(242,227,189,.45); border-radius: 6px; font-size: .8em; padding: .15em .45em; }
.talk .next { font-family: var(--pixel); font-size: .6em; color: var(--gold); animation: blink 1s steps(2) infinite; }
.talk.thought { background: #fff; color: #2a2040; border-color: #fff; border-radius: 22px; }
.talk.thought .who { color: #6a5a90; }
.talk.thought .ctl button { color: #2a2040; border-color: #b8aed6; }
.talk.thought .txt { font-style: italic; }
.talk.narr { background: rgba(14, 11, 26, .92); border-color: rgba(242,227,189,.5); justify-content: center; text-align: center; }
.talk.narr .txt { font-style: italic; }
.talk.jehovah { background: linear-gradient(180deg, #fff6d0, #f7d77a); color: #4a2e08; border-color: #fff6d0; box-shadow: 0 0 0 3px #c8902a, 0 0 40px 10px rgba(255, 220, 120, .55); }
.talk.jehovah .who { color: #8a5a10; }
.talk.jehovah .ref { color: #7a5a20; }
.talk.jehovah .ctl button { color: #4a2e08; border-color: #c8902a; }
.talk.jehovah .next { color: #8a5a10; }
.talk.top { bottom: auto; top: 3cqw; }

/* ---------- Cards (questions, choices, lessons) ---------- */
.veil { position: absolute; inset: 0; background: rgba(8, 6, 16, .55); display: grid; place-items: center; animation: fade .2s; }
.card { width: min(84cqw, 760px); max-height: 92%; overflow: auto; background: var(--parch); color: var(--parch-ink); border-radius: 10px; border: 4px solid #8a5a2b; box-shadow: 0 0 0 3px var(--ol), 0 10px 0 3px rgba(0,0,0,.35); padding: 1.6cqw 2.4cqw; font-size: clamp(13px, 2.05cqw, 22px); line-height: 1.35; animation: pop .18s ease-out; }
.card h2 { font-family: var(--pixel); font-size: .72em; line-height: 1.5; margin: 0 0 .6em; color: #8a3a1a; letter-spacing: .03em; }
.card .role { display: inline-block; background: #3b2616; color: var(--parch); border-radius: 6px; padding: .2em .6em; font-weight: 700; font-size: .85em; margin-bottom: .5em; }
.card .open { font-size: 1.15em; font-weight: 700; margin: .2em 0 .4em; }
.card .open b { background: #fff3c4; padding: 0 .3em; border-radius: 4px; }
.card .q { margin: .3em 0 .7em; }
.card .opts { display: grid; gap: .45em; }
.card .opt { text-align: left; font-size: 1em; padding: .4em .75em; border-radius: 8px; border: 3px solid #8a5a2b; background: #fffaf0; color: var(--parch-ink); box-shadow: 0 3px 0 #8a5a2b; }
.card .opt:hover { background: #fff3c4; }
.card .opt.right { background: #d8f2c8; border-color: #3f8a2a; box-shadow: 0 3px 0 #3f8a2a; }
.card .opt.wrong { background: #f6d4cc; border-color: #b8432a; box-shadow: 0 3px 0 #b8432a; opacity: .7; animation: shake .3s; }
.card .opt .k { display: inline-block; min-width: 1.6em; font-family: var(--pixel); font-size: .6em; color: #8a5a2b; }
.card .row { display: flex; flex-wrap: wrap; gap: .5em; margin-top: .7em; align-items: center; }
.card .btn { font-size: .95em; font-weight: 700; padding: .5em 1em; border-radius: 8px; border: 3px solid #3b2616; background: var(--gold); color: #3b2616; box-shadow: 0 3px 0 #3b2616; }
.card .btn.alt { background: #fffaf0; }
.card .btn.small { font-size: .8em; padding: .3em .7em; }
.card .btn:disabled { opacity: .45; }
.card .fb { margin-top: .5em; font-weight: 700; }
.card .fb.ok { color: #2f6a1f; }
.card .fb.no { color: #a8331f; }
.card .verse { background: #fffaf0; border-left: 6px solid var(--gold-deep); padding: .5em .8em; border-radius: 6px; font-style: italic; margin: .5em 0; }
.card .verse cite { display: block; font-style: normal; font-weight: 700; font-size: .8em; margin-top: .3em; color: #8a5a2b; }
.card .nudge { background: #fff3c4; border-radius: 6px; padding: .3em .6em; font-size: .9em; }
.card .typebox { display: flex; gap: .5em; margin-top: .6em; }
.card .typebox input { flex: 1; min-width: 0; font: inherit; font-size: 1.05em; padding: .4em .6em; border-radius: 8px; border: 3px solid #8a5a2b; background: #fffaf0; color: var(--parch-ink); }
.card .typebox input:focus { outline: 3px solid var(--gold); outline-offset: 1px; }
.card .think { background: #eef3ff; border-left: 6px solid #6a5a90; padding: .5em .8em; border-radius: 6px; margin: .5em 0; }
.card .small { font-size: .8em; color: #6b4e33; }
.card .stars { font-size: 2em; letter-spacing: .1em; color: var(--gold-deep); text-shadow: 0 2px 0 #3b2616; }
.card .gemrow { display: flex; gap: .8em; flex-wrap: wrap; }
.card .lessonicon { float: right; font-size: 2.4em; margin-left: .3em; }

/* ---------- Full screens (title, map, roles, ending) ---------- */
#screen { position: absolute; inset: 0; pointer-events: none; }
#screen > * { pointer-events: auto; }
.title { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 1.6cqw; }
.title h1 { font-family: var(--pixel); font-size: clamp(22px, 5.6cqw, 56px); margin: 0; color: var(--gold); text-shadow: 0 .5cqw 0 #7a3a10, 0 1cqw 0 var(--ol); line-height: 1.25; }
.title p { margin: 0; font-size: clamp(13px, 2.2cqw, 22px); color: #fff; text-shadow: 0 2px 0 var(--ol); }
.title .src { position: absolute; bottom: 1.4cqw; font-size: clamp(10px, 1.4cqw, 14px); color: #fff; opacity: .8; text-shadow: 0 1px 0 var(--ol); }
.title .src a { color: var(--gold); }
a.bigbtn { text-decoration: none; }
.title .back { position: absolute; left: 2cqw; top: 2cqw; font-size: clamp(10px, 1.5cqw, 15px); }
.bigbtn { font-family: var(--pixel); font-size: clamp(12px, 2.2cqw, 22px); padding: .9em 1.4em; border-radius: 10px; border: 4px solid var(--ol); background: var(--gold); color: #3b2616; box-shadow: 0 6px 0 var(--ol); }
.bigbtn:active { transform: translateY(3px); box-shadow: 0 3px 0 var(--ol); }
.bigbtn.alt { background: var(--parch); }
.mapscreen { position: absolute; inset: 0; }
.mapscreen .node { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: .2em; background: none; border: 0; color: #fff; font-size: clamp(10px, 1.6cqw, 17px); text-shadow: 0 2px 0 var(--ol), 0 0 4px var(--ol); }
.mapscreen .node .dot { width: 5.5cqw; height: 5.5cqw; min-width: 30px; min-height: 30px; border-radius: 50%; background: var(--gold); border: 4px solid var(--ol); display: grid; place-items: center; font-family: var(--pixel); font-size: 1.1em; color: #3b2616; box-shadow: 0 4px 0 var(--ol); }
.mapscreen .node.locked .dot { background: #8a8478; }
.mapscreen .node.locked { opacity: .75; cursor: default; }
.mapscreen .node .nm { font-weight: 700; white-space: nowrap; background: rgba(14,11,26,.6); padding: .1em .4em; border-radius: 4px; }
.mapscreen .node .st { color: var(--gold); letter-spacing: .05em; }
.mapscreen .hdr { position: absolute; left: 2cqw; top: 2cqw; font-family: var(--pixel); font-size: clamp(11px, 2cqw, 20px); color: var(--gold); text-shadow: 0 2px 0 var(--ol); }
.mapscreen .gembar { position: absolute; right: 2cqw; top: 1.6cqw; display: flex; gap: .6em; font-size: clamp(12px, 2cqw, 20px); background: rgba(14,11,26,.7); padding: .3em .7em; border-radius: 8px; font-weight: 700; }
.mapscreen .back { position: absolute; left: 2cqw; bottom: 2cqw; }
.ending { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 4cqw; text-align: center; pointer-events: none; }
.lyric { font-size: clamp(14px, 2.8cqw, 30px); font-weight: 700; color: #fff; text-shadow: 0 2px 0 var(--ol), 0 0 8px var(--ol); transition: opacity .4s; background: rgba(14, 11, 26, .55); padding: .25em .9em; border-radius: 10px; margin-bottom: .6em; }
.lyric:empty { background: none; }
.credits { background: rgba(14, 11, 26, .6); padding: .6em 1em; border-radius: 10px; }
.credits { font-size: clamp(12px, 2cqw, 20px); color: #fff; text-shadow: 0 2px 0 var(--ol); }
.skip { position: absolute; right: 2cqw; bottom: 2cqw; font-size: clamp(12px, 1.8cqw, 18px); background: rgba(14,11,26,.7); color: #fff; border: 2px solid rgba(255,255,255,.5); border-radius: 8px; padding: .3em .8em; }
.mash { position: absolute; inset: 0; display: grid; grid-template-rows: auto 1fr auto; padding: 2cqw; pointer-events: auto; }
.mash h2 { font-family: var(--pixel); font-size: clamp(12px, 2.4cqw, 24px); color: var(--gold); text-align: center; margin: 0 auto; text-shadow: 0 3px 0 var(--ol); background: rgba(14,11,26,.7); padding: .5em .8em; border-radius: 10px; }
.mash .sub { text-align: center; font-size: clamp(12px, 1.9cqw, 19px); color: #fff; text-shadow: 0 2px 0 var(--ol); background: rgba(14,11,26,.55); padding: .3em .8em; border-radius: 8px; margin: .5em auto 0; max-width: 80%; align-self: start; }
.mash .bars { display: grid; grid-template-columns: 1fr 1fr; gap: 3cqw; align-items: end; }
.mash .pl { display: flex; flex-direction: column; gap: .6em; align-items: center; }
.mash .meterv { width: 100%; height: 3cqw; min-height: 18px; background: #3a2f55; border: 3px solid var(--ol); border-radius: 8px; overflow: hidden; }
.mash .meterv i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--gold), #ff8a3a); }
.mash .press { font-family: var(--pixel); font-size: clamp(12px, 2.2cqw, 22px); width: 100%; padding: 1em; border-radius: 12px; border: 4px solid var(--ol); background: var(--parch); color: #3b2616; box-shadow: 0 6px 0 var(--ol); touch-action: none; }
.mash .press.hit { transform: translateY(3px); box-shadow: 0 3px 0 var(--ol); background: var(--gold); }
.lesson { text-align: left; }

@keyframes pop { from { transform: scale(.94); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } }
@keyframes blink { 50% { opacity: 0; } }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<div id="stage">
  <canvas id="cv" width="320" height="192"></canvas>
  <div id="hud" hidden>
    <div id="goals"></div>
    <div id="topc"><div id="lvname"></div><div id="meter" hidden><span id="meterLabel"></span><div class="bar"><i id="meterFill"></i></div></div></div>
    <div id="topr"><span class="chip" id="hudScrolls">📜 0/3</span><span class="chip" id="hudCoins" hidden>🪙 0</span><button id="btnMute" aria-label="Sound on or off">🔊</button><button id="btnMenu" aria-label="Menu">☰</button></div>
  </div>
  <div id="touch" hidden>
    <div class="pad pl" data-who="d"><span class="tag"></span><button data-k="left" aria-label="Left">◀</button><button data-k="right" aria-label="Right">▶</button><button data-k="jump" aria-label="Jump">⤒</button><button data-k="talk" aria-label="Talk">💬</button></div>
    <div class="pad pu" data-who="d" hidden><button data-k="up" aria-label="Up">▲</button><button data-k="down" aria-label="Down">▼</button></div>
    <div class="pad pr" data-who="l"><span class="tag"></span><button data-k="left" aria-label="Left">◀</button><button data-k="right" aria-label="Right">▶</button><button data-k="jump" aria-label="Jump">⤒</button><button data-k="talk" aria-label="Talk">💬</button></div>
  </div>
  <div id="bubble" hidden></div>
  <div id="screen"></div>
  <div id="layer"></div>
</div>
<script src="jonah-art.js"></script>
<script src="jonah-audio.js"></script>
<script src="jonah-levels.js"></script>
<script src="jonah-scenes.js"></script>
<script src="jonah-game.js"></script>
</html>
